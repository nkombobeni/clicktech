/* FILENAME: index.html */
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Découvrez notre catalogue de produits tech avec comparatifs, avis et liens d'affiliation Amazon."
  />

  <title>ClickTech - Catalogue Produits</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =========================
       SECTION CATALOGUE PRODUITS
  ========================== -->
  <section class="catalogue-section" aria-label="Catalogue produits">
    <div class="container">

      <!-- Titre section -->
      <div class="section-heading">
        <span class="section-label">Produits Tech</span>
        <h2>Notre sélection du moment</h2>
        <p>
          Retrouvez les meilleurs produits tech et maison connectée sélectionnés
          pour leurs performances, leur fiabilité et leur rapport qualité/prix.
        </p>
      </div>

      <!-- Grille produits dynamique -->
      <div class="products-grid" id="productsGrid"></div>

      <!-- Bouton Voir tous les articles -->
      <div class="see-more-wrapper">
        <a
          href="SEE_MORE_LINK_ICI"
          class="see-more-btn"
          aria-label="Voir tous les articles"
        >
          Voir tous les articles
          <span class="arrow">›</span>
        </a>
      </div>

    </div>
  </section>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
